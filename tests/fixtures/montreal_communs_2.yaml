step_copy:
  welcome:
    title: Communs de données et IA
    body: 'Pour finaliser notre inscription au Forum Communs de données et IA (28–29 octobre 2026, INRS), prenons environ
      20 minutes pour répondre à ces questions.


      Cette démarche poursuit deux objectifs :

      1. Mieux nous connaître : situer nos champs d’activité, ce que nous pouvons partager, ce que nous recherchons et nos
      visions du futur.

      2. Documenter un projet, si applicable : lorsqu’une organisation culturelle, patrimoniale ou éducative porte un projet
      lié à la thématique du Forum, nous pouvons l’intégrer à la base de connaissances qui accompagne l’événement, notamment
      sous l’angle des données, ressources, pratiques, gouvernance, licences, infrastructures et modèles économiques.


      Plus largement, nos réponses permettront de cartographier le réseau d’acteurs en présence, les collaborations établies
      et les initiatives collectives existantes.


      Une version courte est proposée à l’ensemble des personnes participantes; une version longue pourra approfondir les
      projets documentés.


      Sauf indication contraire, plusieurs choix sont possibles. Nous pouvons passer ou signaler chaque question. Nous pourrons
      relire, modifier, réaligner et faire évoluer nos réponses.'
    cta: Commencer
  participation_information:
    title: Informations sur notre participation
    body: 'Les informations recueillies serviront à préparer l’organisation du Forum Communs de données et IA des 28–29 octobre
      2026. Elles pourront également nourrir des publications qui découleront de cet événement (synthèse, article scientifique).


      Nos noms ne seront pas mentionnés dans les publications qui découleront du projet.


      Les réponses sont annoncées comme conservées de façon sécurisée durant 5 ans et accessibles à l’équipe de recherche.
      Certaines informations d’identification professionnelle pourront être partagées avec les autres personnes participantes
      afin de faciliter le réseautage.


      Nous sommes libres de répondre ou non à chaque question et pouvons interrompre le parcours. Si nous souhaitons retirer
      nos réponses, nous pouvons contacter les responsables ci-dessous.


      Responsables : Nathalie Casemajor, professeure à l’INRS, nathalie.casemajor@inrs.ca ; Marta Severo, professeure à l’Université
      Paris Nanterre, msevero@parisnanterre.fr.'
    cta: Continuer
  participation:
    title: Notre participation
    body: 'L’atelier réunit un nombre restreint de 40 personnes sélectionnées sur invitation pour un engagement actif et collectif.
      Nous privilégions une présence aux deux journées : une disponibilité partielle peut potentiellement priver une autre
      personne d’y participer. En cas de disponibilité limitée, l’équipe pourra reprendre contact avec nous pour préciser
      les modalités.'
    cta: Continuer
  portrait:
    title: Qui sommes-nous ?
    body: 'Situons notre activité et, le cas échéant, notre organisation dans l’écosystème des acteurs présents au Forum.
      Aucune réponse substantielle n’est obligatoire : chaque question peut être passée.'
    cta: Continuer
  organisation:
    title: Notre organisation
    body: Ces questions apparaissent lorsque nous participons au nom d’une organisation ou dans les deux positions.
    cta: Continuer
  project:
    title: Un projet à documenter ?
    body: Si notre organisation développe un projet de mise à disposition de données dans le contexte des usages de l’IA,
      nous pouvons choisir de le documenter.
    cta: Continuer
  exchange_offer:
    title: Ce que nous pouvons mettre en commun
    body: 'Cartographions ce que nous pouvons partager sur les communs de données et l’IA : connaissances, expérimentations,
      outils ou ressources.'
    cta: Continuer
  exchange_need:
    title: Ce que nous recherchons
    body: 'La même carte est utilisée dans les deux directions : ce que nous pouvons apporter et ce que nous aimerions recevoir
      des autres.'
    cta: Continuer
  friction:
    title: Ce qui freine notre capacité à avancer
    body: Distinguons les contraintes actuelles des ressources ou connaissances que nous recherchons.
    cta: Continuer
  inspiration:
    title: Ce qui nous inspire
    body: Une initiative, un outil, une communauté ou une expérience peut ouvrir une piste inattendue.
    cta: Continuer
  future_intro:
    title: Vision du futur
    body: 'Nous cherchons ici des pistes d’action par rétroplanification à partir d’un futur souhaité pour les communs de
      données, qui sera approfondi lors du Forum.


      En 2027, Genève accueillera un prochain sommet international sur l’IA, dans la continuité des sommets de Bletchley Park
      (2023), Séoul (2024), Paris (2025) et New Delhi (2026). Prenons Genève comme horizon de travail et projetons-nous au
      lendemain de ce rendez-vous, dans un scénario favorable aux communs de données.


      Les résultats possibles ne sont pas limités à des productions institutionnelles : ils peuvent aussi prendre la forme
      d’une expérimentation, d’une nouvelle collaboration, d’un désaccord devenu plus clair, d’un apprentissage issu d’un
      échec ou d’une initiative inattendue.'
    cta: Nous projeter
  future_outcome:
    title: Ce que nous aimerions voir émerger
    body: À quoi pourrait ressembler, pour nous, un résultat positif pour les communs de données ?
    cta: Continuer
  future_effects:
    title: Ce que cela changerait
    body: Passons du résultat souhaité à ses effets concrets dans nos pratiques, projets, organisations ou domaines de recherche.
    cta: Continuer
  future_conditions:
    title: Comment y arriver ?
    body: Décomposons le chemin en étapes ou actions, et associons à chacune les acteur·ices susceptibles de la porter.
    cta: Continuer
  future_contribution:
    title: Ce que je peux mettre sur la table
    body: Quelle contribution réelle suis-je prêt·e à envisager pour rendre ce futur plus accessible ?
    cta: Continuer
  scenario_position:
    title: Depuis quelle position puis-je agir ?
    body: Plutôt que d’imposer un rôle fictionnel, partons d’abord de positions réelles. Plusieurs positions peuvent coexister.
    cta: Continuer
  review:
    title: Relire nos réponses
    body: Relisons, modifions et réalignons nos réponses. Les questions passées, les raisons de passage et les signalements
      doivent rester visibles et éditables.
    cta: Intégrer au paysage commun
  done:
    title: Merci
    body: 'Merci d’avoir pris le temps de contribuer. Nos réponses ont été enregistrées et peuvent maintenant participer à
      une représentation collective du Forum. Des informations pratiques concernant le déroulement de l’événement suivront.
      Pour une précision ou une demande de retrait : nathalie.casemajor@inrs.ca et msevero@parisnanterre.fr.'
    cta: Voir le paysage commun
