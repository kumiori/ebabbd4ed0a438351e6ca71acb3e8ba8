interaction:
  nothing_substantively_mandatory: true
  question_resolution:
  - answer
  - skip
  - flag
  answer_before_meta_actions: true
  subordinate_fields_inherit_parent_resolution: true
  skip:
    enabled: true
    reason_prompt: Pourquoi est-ce que je passe cette question ?
    reasons:
    - value: not_applicable
      label: Non applicable
    - value: dont_know
      label: Je ne sais pas
    - value: prefer_not
      label: Je préfère ne pas répondre
    - value: cannot_answer
      label: La question ne me permet pas de répondre correctement
    - value: other
      label: Autre
    note_optional: true
  flag:
    enabled: true
    prompt: Signalons positivement ou négativement ce qui fonctionne, ce qui ne fonctionne pas ou mérite attention.
    options:
    - value: interesting
      label: Intéressante
    - value: useful
      label: Utile
    - value: thought_provoking
      label: Stimulante
    - value: well_framed
      label: Bien formulée
    - value: incomplete
      label: Incomplète
    - value: misleading
      label: Trompeuse
    - value: too_narrow
      label: Trop étroite
    - value: unclear
      label: Peu claire
    - value: missing_option
      label: Option manquante
    note_optional: true
  review_editable: true
  mobile:
    prefer_selection_over_typing: true
